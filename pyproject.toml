[project]
name = "dynamic-gating-raw-ap"
version = "0.1.0"
description = "Discover, align, and validate Dynamic Gating raw AP recordings for S3 staging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "h5py>=3.12",
    "fsspec[http]>=2024.10",
    "requests>=2.32",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
dynamic-gating-ap = "dynamic_gating_ap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["dynamic_gating_ap"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
